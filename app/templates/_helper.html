{# Live helper panel; include next to a form. Needs: form_id, check_url. #}
<aside class="card helper" id="helper" data-form="{{ form_id }}" data-check-url="{{ check_url }}" aria-labelledby="helper-title">
  <div class="card-head"><h2 id="helper-title">Helper</h2><span class="right small muted helper-status" aria-live="polite"></span></div>
  <ul class="hints" aria-live="polite"></ul>
</aside>
