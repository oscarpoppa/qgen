{# the messages box on a student's home page #}
<section class="card" id="messages" data-panel-url="{{ url_for('messages.panel') }}" aria-labelledby="messages-title">
  <div class="card-head"><h2 id="messages-title">Messages</h2>
    {% if unread_ids %}<span class="badge badge-warn">{{ unread_ids|length }} new</span>{% endif %}</div>
  <div class="thread-scroll">{% set me_teacher = false %}{% include "_thread.html" %}</div>
  <form method="post" action="{{ url_for('messages.reply') }}" class="reply-box" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="reply" class="sr-only">Message to your teacher</label>
    <textarea id="reply" name="body" rows="2" maxlength="{{ max_len }}" required placeholder="Write to your teacher…"></textarea>
    <button class="btn">Send</button>
  </form>
</section>
