{% extends "base.html" %}

{% block content %}
<div class="page-head">
  <h1>Images</h1>
  <div class="actions"><a class="btn" href="{{ url_for('upload.upload') }}">Upload pictures</a></div>
</div>
{% if imgs %}
  <div class="thumbs">
  {% for pair in imgs %}
    <div class="thumb">
      <a href="{{ url_for('static', filename=pair[1]) }}" target="_blank" rel="noopener"><img src="{{ url_for('static', filename=pair[0]) }}" alt="{{ pair[1] }}"></a>
      <div class="name">{{ pair[1] }}</div>
      <a class="btn btn-danger btn-sm" href="{{ url_for('upload.delimg', fname=pair[1]) }}" onclick="return confirm('Delete the picture “{{ pair[1]|e }}”? Problems using it will show no picture.');">Delete</a>
    </div>
  {% endfor %}
  </div>
{% else %}
  <div class="card empty"><span class="big">🖼️</span>No pictures yet. <a href="{{ url_for('upload.upload') }}">Upload some</a>.</div>
{% endif %}
{% endblock %}
