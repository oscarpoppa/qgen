{% extends "base.html" %}

{% block content %}
<div class="page-head">
  <h1>Other files</h1>
  <div class="actions"><a class="btn" href="{{ url_for('upload.upload') }}">Upload a file</a></div>
</div>
{% if files %}
  <div class="table-wrap stack">
    <table>
      <thead><tr><th>File</th><th></th></tr></thead>
      <tbody>
      {% for file in files %}
        <tr>
          <td data-label="File">{{ file }}</td>
          <td class="actions">
            <a class="btn btn-secondary btn-sm" href="{{ url_for('static', filename=file) }}" target="_blank" rel="noopener">View</a>
            <a class="btn btn-danger btn-sm" href="{{ url_for('upload.delnonimg', fname=file) }}" onclick="return confirm('Delete “{{ file|e }}”?');">Delete</a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <div class="card empty">No other files uploaded.</div>
{% endif %}
{% endblock %}
