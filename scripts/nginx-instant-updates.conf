# Instant updates (app/push.py): what the site's nginx file needs, in
# ~/anaconda3/etc/nginx/sites.d/default-site.conf. Pages keep a connection open at
# /socket.io; nginx must pass it on as a WebSocket and leave it open.

# outside the server { } block:
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# inside the server { } block, next to "location / { ... }":
    location /socket.io {
        proxy_pass http://unix:/tmp/qgen.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
